<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contigoway · TODO</title>
<style>
  :root{
    --black:#1D1D1F;--gray:#6E6E73;--gray-light:#86868B;--blue:#0071E3;
    --bg:#FFFFFF;--panel:#F5F5F7;--line:#D2D2D7;
    --red:#FF3B30;--yellow:#FFCC00;--green:#34C759;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--black);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:center}
  .nav-inner{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:48px;font-size:.82rem;font-weight:500}
  .breadcrumb-bar{background:var(--panel);border-bottom:1px solid var(--line)}
  .breadcrumb{max-width:980px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--gray)}
  .breadcrumb a{color:var(--gray);text-decoration:none}
  .breadcrumb a:hover{color:var(--black)}
  .breadcrumb .crumb-sep{color:var(--line)}
  .breadcrumb .crumb-current{color:var(--black);font-weight:600}
  .progress-wrap{max-width:980px;margin:14px auto 0;padding:0 24px}
  .progress-bar-bg{cursor:pointer;background:var(--panel);border-radius:980px;padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:.78rem;color:var(--gray)}
  .progress-track{flex:1;height:6px;background:var(--line);border-radius:980px;overflow:hidden}
  .progress-fill{height:100%;background:var(--blue);border-radius:980px}
  .progress-detail{display:none;background:var(--panel);border-radius:14px;margin-top:8px;padding:14px 18px;font-size:.8rem}
  .progress-detail.open{display:block}
  .progress-detail .p-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  .progress-detail .p-row:last-child{border-bottom:none}
  .progress-detail .p-done{color:#0C7A3D;font-weight:600}
  .progress-detail .p-pending{color:var(--gray-light)}
  .nav-links{display:flex;gap:24px;align-items:center;color:var(--gray)}
  .nav-links a{color:var(--gray);text-decoration:none}
  .nav-links .active{color:var(--black)}
  .nav-links .greet{color:var(--black);font-weight:600}
  .logout-link{color:var(--blue);cursor:pointer}

  main{max-width:600px;margin:0 auto;padding:0 20px 100px}

  .page-header{padding:32px 0 18px;text-align:center}
  .page-header h1{font-size:1.5rem;font-weight:700}
  .font-size-control{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
  .font-size-control button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-weight:800;cursor:pointer;color:var(--black)}
  .font-size-control button:first-child{font-size:.78rem}
  .font-size-control button:last-child{font-size:1.05rem}
  .font-size-control .fs-label{font-size:.78rem;color:var(--gray-light);min-width:38px;text-align:center}

  .date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px}
  .date-nav button{border:none;background:var(--panel);width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer}
  .date-input-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
  .date-nav input[type=date]{border:1px solid var(--line);border-radius:980px;padding:8px 16px;font-size:.9rem;font-weight:600;text-align:center;cursor:pointer}
  .weekday-label{font-size:.76rem;font-weight:700;color:var(--blue)}

  /* 완료 현황 카드 */
  .stats-card{
    background:linear-gradient(135deg,#EAF2FB,#F3EDFB);border-radius:20px;padding:18px 22px;margin-bottom:18px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .stats-left{flex:1}
  .stats-title{font-size:.82rem;color:var(--gray);font-weight:600;margin-bottom:6px}
  .stats-count{font-size:1.3rem;font-weight:800}
  .stats-count b{color:var(--blue)}
  .stats-ring-wrap{position:relative;width:58px;height:58px;flex-shrink:0}
  .stats-ring-wrap svg{transform:rotate(-90deg)}
  .stats-ring-bg{fill:none;stroke:#fff;stroke-width:6}
  .stats-ring-fg{fill:none;stroke:var(--blue);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .4s ease}
  .stats-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800}

  /* 카테고리 필터 칩 */
  .cat-filter-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}
  .cat-chip-btn{
    border:1px solid var(--line);background:#fff;border-radius:980px;padding:6px 13px;font-size:.8rem;font-weight:600;
    cursor:pointer;color:var(--gray);white-space:nowrap;transition:.15s;
  }
  .cat-chip-btn.active{background:var(--black);color:#fff;border-color:var(--black)}
  .cat-manage-btn{border:1px dashed var(--line);background:none;border-radius:980px;padding:6px 13px;font-size:.8rem;color:var(--gray-light);cursor:pointer}

  /* 할 일 추가 카드 */
  .add-card{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:20px}
  .add-card input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:.92rem;outline:none;background:#fff;margin-bottom:10px}
  .add-card input[type=text]:focus{border-color:var(--blue)}
  .add-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .add-row2 select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;background:#fff;flex:1;min-width:110px}
  .priority-picker{display:flex;gap:6px}
  .prio-opt{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:980px;padding:5px 11px 5px 7px;font-size:.76rem;font-weight:700;color:var(--gray);cursor:pointer;opacity:.5;transition:.15s;background:#fff}
  .prio-opt.selected{opacity:1;border-color:var(--black);color:var(--black)}
  .prio-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
  .prio-dot.red{background:var(--red)}
  .prio-dot.yellow{background:var(--yellow)}
  .prio-dot.green{background:var(--green)}
  .prio-chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--gray)}
  .add-row2 button{background:var(--black);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:.85rem;font-weight:700;cursor:pointer;margin-left:auto}

  /* 할 일 카드 */
  .todo-card{background:var(--panel);border-radius:16px;margin-bottom:10px;overflow:hidden;border-left:5px solid var(--line)}
  .todo-main{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer}
  .todo-checkbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:#fff;margin-top:1px}
  .todo-checkbox.done{background:var(--green);border-color:var(--green);color:#fff}
  .todo-body{flex:1;min-width:0}
  .todo-content{font-size:.94rem;font-weight:600;word-break:break-word;line-height:1.4}
  .todo-content.done{color:var(--gray-light);text-decoration:line-through;font-weight:500}
  .todo-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
  .cat-chip{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:980px;color:#3a3a3a}
  .time-chip{font-size:.72rem;color:var(--gray-light)}
  .time-chip.done-chip{color:#0C7A3D;font-weight:600}
  .photo-badge{font-size:.72rem;color:var(--gray-light)}
  .expand-caret{color:var(--gray-light);font-size:.8rem;margin-top:2px;flex-shrink:0;transition:transform .15s}
  .expand-caret.open{transform:rotate(90deg)}

  .mini-progress{margin-top:8px;display:flex;align-items:center;gap:8px}
  .mini-progress-track{flex:1;height:7px;background:#e3e3e8;border-radius:980px;overflow:hidden}
  .mini-progress-fill{height:100%;background:var(--blue);border-radius:980px}
  .mini-progress-label{font-size:.72rem;color:var(--gray);font-weight:700;white-space:nowrap}

  .todo-detail{display:none;padding:0 16px 16px 52px;border-top:1px solid #e5e5ea}
  .todo-detail.open{display:block;padding-top:12px}
  .detail-section{margin-bottom:14px}
  .detail-label{font-size:.74rem;font-weight:700;color:var(--gray);margin-bottom:7px}

  .progress-editor{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .progress-editor input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:.82rem;text-align:center}
  .progress-editor span{color:var(--gray-light);font-size:.8rem}
  .progress-editor button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:600;cursor:pointer}

  .sub-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .sub-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px 10px}
  .sub-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.65rem;background:#fff}
  .sub-check.done{background:var(--blue);border-color:var(--blue);color:#fff}
  .sub-content{flex:1;font-size:.84rem}
  .sub-content.done{color:var(--gray-light);text-decoration:line-through}
  .sub-del{color:var(--gray-light);font-size:.72rem;cursor:pointer}
  .sub-add-row{display:flex;gap:6px}
  .sub-add-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:.82rem;outline:none}
  .sub-add-row button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:.8rem;cursor:pointer}

  .photo-grid{display:flex;flex-wrap:wrap;gap:8px}
  .photo-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#eee}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .photo-thumb .photo-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .photo-add-label{width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--gray-light);cursor:pointer;flex-shrink:0}
  .photo-add-label input{display:none}

  .detail-footer{display:flex;gap:10px;margin-top:4px}
  .detail-footer span{font-size:.78rem;color:var(--gray);cursor:pointer;font-weight:600}
  .detail-footer .danger{color:#D93025}

  .edit-inline{width:100%;padding:6px 10px;border:1px solid var(--blue);border-radius:8px;font-size:.9rem;outline:none;margin-bottom:8px}
  .empty-state{text-align:center;color:var(--gray-light);padding:50px 0;font-size:.9rem}

  .sub-section{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
  .sub-section h3{font-size:.88rem;font-weight:700;margin-bottom:10px;color:var(--gray)}
  .io-row{display:flex;gap:8px;flex-wrap:wrap}
  .io-row button, .io-row label{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--black)}
  .io-row input[type=file]{display:none}
  .io-msg{font-size:.78rem;color:var(--gray);margin-top:8px;min-height:1em}

  /* 카테고리 관리 모달 */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:#fff;border-radius:20px;padding:24px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
  .modal-box h3{font-size:1.05rem;font-weight:700;margin-bottom:16px}
  .cat-manage-row{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:8px 10px;margin-bottom:8px}
  .cat-manage-row input[type=text]{border:none;background:none;font-size:.86rem;flex:1;outline:none}
  .cat-manage-row input[type=color]{width:26px;height:26px;border:none;border-radius:6px;padding:0;cursor:pointer}
  .cat-manage-row .cat-del{color:#D93025;font-size:.75rem;cursor:pointer;font-weight:600}
  .cat-new-row{display:flex;gap:6px;margin-top:10px}
  .cat-new-row input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.84rem;outline:none}
  .cat-new-row input[type=text].emoji-input{flex:none;width:52px;text-align:center}
  .cat-new-row input[type=color]{width:34px;height:34px;border:none;border-radius:8px;cursor:pointer;padding:0}
  .cat-new-row button{background:var(--black);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:.82rem;font-weight:700;cursor:pointer}
  .modal-close{display:block;width:100%;margin-top:16px;background:var(--panel);border:none;border-radius:10px;padding:10px;font-size:.86rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/index.html" class="brand" style="text-decoration:none;color:inherit;font-weight:600;display:flex;align-items:center;gap:8px">
      <svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true" style="flex-shrink:0">

        <path d="M22.2 11.2 c0-1.3 1-2 2-2 s2 0.7 2 2 c0 1.6 -2 3.2 -2 3.2 s-2 -1.6 -2 -3.2 z" fill="#fff"/>

</nav>

<div class="breadcrumb-bar">
  <div class="breadcrumb">

    <span class="crumb-current">TODO</span>
  </div>
</div>

<main>
  <div class="page-header">
    <h1>✅ 오늘의 TODO</h1>
    <div class="font-size-control">
      <button onclick="changeFontSize(-1)" title="글씨 작게">가</button>
      <span class="fs-label" id="fontSizeLabel">100%</span>

  <div class="stats-card">
    <div class="stats-left">
      <div class="stats-title">오늘 처리 현황</div>
      <div class="stats-count" id="statsCount"><b>0</b> / 0 완료</div>
    </div>
    <div class="stats-ring-wrap">
      <svg width="58" height="58" viewBox="0 0 58 58">
        <circle class="stats-ring-bg" cx="29" cy="29" r="24"></circle>
        <circle class="stats-ring-fg" id="statsRing" cx="29" cy="29" r="24" stroke-dasharray="0 151"></circle>
      </svg>
      <div class="stats-ring-label" id="statsPct">0%</div>
    </div>
  </div>

  <div class="cat-filter-row" id="catFilterRow"></div>

  <div class="add-card">

      <div class="priority-picker" id="newPriorityPicker">

  <div id="todoList"></div>

  <div class="sub-section">
    <h3>스프레드시트 연동</h3>
    <div class="io-row">
      <button onclick="exportTodos('xlsx')">📥 엑셀로 내보내기</button>
      <button onclick="exportTodos('csv')">📥 CSV로 내보내기</button>
      <label>📤 파일에서 가져오기<input type="file" id="importFile" accept=".xlsx,.csv" onchange="importTodos()"></label>
    </div>
    <div class="io-msg" id="ioMsg"></div>
  </div>
</main>

<div class="modal-overlay" id="catModalOverlay">
  <div class="modal-box">
    <h3>🏷️ 카테고리 관리</h3>
    <div id="catManageList"></div>
    <div class="cat-new-row">
      <input type="text" id="catNewEmoji" class="emoji-input" placeholder="📌" maxlength="4">
      <input type="text" id="catNewName" placeholder="예: 청구작업">
      <input type="color" id="catNewColor" value="#EAF2FB">
      <button onclick="createCategory()">추가</button>
    </div>
    <button class="modal-close" onclick="closeCatModal()">닫기</button>
  </div>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if(!token){ location.href = '/login.html'; }

function logout(){ localStorage.clear(); location.href = '/login.html'; }

async function authFetch(path, opts={}){
  opts.headers = Object.assign({}, opts.headers, {'Authorization':'Bearer '+token});
  const r = await fetch(API + path, opts);
  if(r.status === 401){ logout(); throw new Error('unauthorized'); }
  return r;
}

let currentDate = new Date().toISOString().slice(0,10);
let categories = [];
let currentList = [];
let activeCategoryFilter = null; // null = 전체
let newPriority = null;
let expandedIds = new Set();

// ── 글씨 크기 조절 (저시력 사용자 배려) ──
const FONT_STEPS = [87.5, 100, 112.5, 125, 137.5, 150, 162.5];
let fontStepIndex = FONT_STEPS.indexOf(Number(localStorage.getItem('todoFontPct')));
if(fontStepIndex === -1) fontStepIndex = 1;
function applyFontSize(){
  const pct = FONT_STEPS[fontStepIndex];
  document.documentElement.style.fontSize = (16 * pct / 100) + 'px';
  document.getElementById('fontSizeLabel').textContent = pct + '%';
  localStorage.setItem('todoFontPct', pct);
}
function changeFontSize(dir){
  fontStepIndex = Math.min(FONT_STEPS.length - 1, Math.max(0, fontStepIndex + dir));
  applyFontSize();
}
applyFontSize();

function updateWeekdayLabel(){
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date(currentDate + 'T00:00:00');
  document.getElementById('weekdayLabel').textContent = days[d.getDay()] + '요일';
}

(async function init(){
  document.getElementById('dateInput').value = currentDate;
  updateWeekdayLabel();
  try{
    const r = await authFetch('/auth/me');
    const me = await r.json();
    document.getElementById('greetName').textContent = me.full_name + '님';
    if(me.role === 'admin'){
      document.getElementById('usersNavLink').style.display = 'inline';
      document.getElementById('annNavLink').style.display = 'inline';
    }
  }catch(e){}
  await loadCategories();
  await loadTodos();
})();

function changeDate(delta){
  const d = new Date(currentDate);
  d.setDate(d.getDate()+delta);
  currentDate = d.toISOString().slice(0,10);
  document.getElementById('dateInput').value = currentDate;
  updateWeekdayLabel();
  loadTodos();
}
function onDateChange(){
  currentDate = document.getElementById('dateInput').value;
  updateWeekdayLabel();
  loadTodos();
}

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
}

// ── 카테고리 ──
async function loadCategories(){
  const r = await authFetch('/todo/categories');
  categories = await r.json();
  renderCategorySelect();
  renderCategoryFilter();
}
function renderCategorySelect(){
  const sel = document.getElementById('newCategorySelect');
  sel.innerHTML = '<option value="">카테고리 없음</option>' +
    categories.map(c => `<option value="${c.id}">${c.emoji||'📌'} ${c.name}</option>`).join('');
}
function renderCategoryFilter(){
  const row = document.getElementById('catFilterRow');
  row.innerHTML = `
    <span class="cat-chip-btn${activeCategoryFilter===null?' active':''}" onclick="setFilter(null)">전체</span>
    ${categories.map(c => `<span class="cat-chip-btn${activeCategoryFilter===c.id?' active':''}" onclick="setFilter(${c.id})">${c.emoji||'📌'} ${c.name}</span>`).join('')}
    <span class="cat-manage-btn" onclick="openCatModal()">⚙️ 관리</span>
  `;
}
function setFilter(catId){
  activeCategoryFilter = catId;
  renderCategoryFilter();
  renderTodos();
}
function openCatModal(){
  renderCatManageList();
  document.getElementById('catModalOverlay').classList.add('open');
}
function closeCatModal(){
  document.getElementById('catModalOverlay').classList.remove('open');
}
function renderCatManageList(){
  const box = document.getElementById('catManageList');
  if(!categories.length){
    box.innerHTML = '<div style="color:#86868B;font-size:.82rem;padding:8px 0">아직 카테고리가 없어요. 아래에서 추가해보세요!</div>';
    return;
  }
  box.innerHTML = categories.map(c => `
    <div class="cat-manage-row">
      <input type="text" value="${(c.emoji||'📌').replace(/"/g,'&quot;')}" maxlength="4" style="width:30px;flex:none;text-align:center"
        onchange="updateCategory(${c.id}, this.value, null, null)">
      <input type="text" value="${c.name.replace(/"/g,'&quot;')}" onchange="updateCategory(${c.id}, null, this.value, null)">
      <input type="color" value="${c.color || '#EAF2FB'}" onchange="updateCategory(${c.id}, null, null, this.value)">
      <span class="cat-del" onclick="deleteCategory(${c.id})">삭제</span>
    </div>
  `).join('');
}
async function updateCategory(id, emoji, name, color){
  const c = categories.find(x => x.id === id);
  if(!c) return;
  const body = {
    emoji: emoji !== null ? emoji : c.emoji,
    name: name !== null ? name : c.name,
    color: color !== null ? color : c.color,
  };
  if(!body.name || !body.name.trim()) return;
  await authFetch(`/todo/categories/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  await loadCategories();
  await loadTodos();
  renderCatManageList();
}
async function deleteCategory(id){
  if(!confirm('이 카테고리를 삭제할까요? (해당 카테고리를 쓰던 할 일은 "카테고리 없음"이 돼요)')) return;
  await authFetch(`/todo/categories/${id}`, {method:'DELETE'});
  if(activeCategoryFilter === id) activeCategoryFilter = null;
  await loadCategories();
  await loadTodos();
  renderCatManageList();
}
async function createCategory(){
  const emoji = document.getElementById('catNewEmoji').value.trim() || '📌';
  const name = document.getElementById('catNewName').value.trim();
  const color = document.getElementById('catNewColor').value;
  if(!name){ alert('카테고리 이름을 입력해주세요'); return; }
  await authFetch('/todo/categories', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, emoji, color})});
  document.getElementById('catNewName').value = '';
  document.getElementById('catNewEmoji').value = '';
  await loadCategories();
  renderCatManageList();
}

// ── 우선순위 선택 (신호등) ──
function pickNewPriority(p){
  newPriority = (newPriority === p) ? null : p;
  document.querySelectorAll('#newPriorityPicker .prio-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.p === newPriority);
  });
}
function priorityColor(p){
  if(p==='red') return 'var(--red)';
  if(p==='yellow') return 'var(--yellow)';
  if(p==='green') return 'var(--green)';
  return 'var(--line)';
}

// ── 할 일 목록 ──
async function loadTodos(){
  const r = await authFetch(`/todo?target_date=${currentDate}`);
  currentList = await r.json();
  renderTodos();
  renderStats();
}

function renderStats(){
  const total = currentList.length;
  const done = currentList.filter(t=>t.is_done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('statsCount').innerHTML = `<b>${done}</b> / ${total} 완료${total>0 && done===total ? ' 🎉' : ''}`;
  document.getElementById('statsPct').textContent = pct + '%';
  const circumference = 2 * Math.PI * 24;
  const fg = document.getElementById('statsRing');
  fg.setAttribute('stroke-dasharray', `${circumference*pct/100} ${circumference}`);
}

function renderTodos(){
  const box = document.getElementById('todoList');
  let list = currentList;
  if(activeCategoryFilter !== null){
    list = list.filter(t => t.category_id === activeCategoryFilter);
  }
  if(!list.length){
    box.innerHTML = '<div class="empty-state">🌤️ 이 조건엔 할 일이 없어요</div>';
    return;
  }
  box.innerHTML = list.map(t => renderTodoCard(t)).join('');
}

function renderTodoCard(t){
  const isOpen = expandedIds.has(t.id);
  const prioLabels = {red:'급함', yellow:'보통', green:'여유'};
  const priorityChip = t.priority
    ? `<span class="prio-chip"><span class="prio-dot ${t.priority}"></span>${prioLabels[t.priority]}</span>` : '';
  const catChip = t.category_name
    ? `<span class="cat-chip" style="background:${t.category_color||'#EAEAEA'}">${t.category_emoji||'📌'} ${t.category_name}</span>` : '';
  const createdChip = `<span class="time-chip">🕐 ${fmtTime(t.created_at)} 등록</span>`;
  const doneChip = t.is_done ? `<span class="time-chip done-chip">✅ ${fmtTime(t.completed_at)} 완료</span>` : '';
  const photoBadge = t.media.length ? `<span class="photo-badge">📷 ${t.media.length}</span>` : '';
  const subBadge = t.subitems.length ? `<span class="photo-badge">☑️ ${t.subitems.filter(s=>s.is_done).length}/${t.subitems.length}</span>` : '';

  let progressHtml = '';
  if(t.progress_end !== null && t.progress_end !== undefined && t.progress_start !== null){
    const cur = t.progress_current !== null && t.progress_current !== undefined ? t.progress_current : t.progress_start;
    const span = Math.max(1, t.progress_end - t.progress_start);
    const pct = Math.min(100, Math.max(0, Math.round((cur - t.progress_start) / span * 100)));
    progressHtml = `
      <div class="mini-progress">
        <div class="mini-progress-track"><div class="mini-progress-fill" style="width:${pct}%"></div></div>
        <div class="mini-progress-label">${cur}/${t.progress_end} (${pct}%)</div>
      </div>`;
  }

  const subitemsHtml = t.subitems.map(s => `
    <div class="sub-row">
      <div class="sub-check${s.is_done?' done':''}" onclick="toggleSubitem(${t.id}, ${s.id})">${s.is_done?'✓':''}</div>
      <div class="sub-content${s.is_done?' done':''}">${escapeHtml(s.content)}</div>
      <span class="sub-del" onclick="deleteSubitem(${t.id}, ${s.id})">삭제</span>
    </div>`).join('');

  const photosHtml = t.media.map(m => `
    <div class="photo-thumb">
      <img src="${m.thumbnail_url || m.url}" onclick="window.open('${m.url}','_blank')">
      <div class="photo-del" onclick="deleteMedia(${t.id}, ${m.id})">✕</div>
    </div>`).join('');

  const catOptions = `<option value="">카테고리 없음</option>` + categories.map(c=>`<option value="${c.id}" ${c.id===t.category_id?'selected':''}>${c.emoji||'📌'} ${c.name}</option>`).join('');

  return `
  <div class="todo-card" data-id="${t.id}" style="border-left-color:${priorityColor(t.priority)}">
    <div class="todo-main" onclick="toggleExpand(${t.id})">
      <div class="todo-checkbox${t.is_done?' done':''}" onclick="event.stopPropagation(); toggleTodo(${t.id})">${t.is_done?'✓':''}</div>
      <div class="todo-body">
        <div class="todo-content${t.is_done?' done':''}">${escapeHtml(t.content)}</div>
        <div class="todo-meta">${priorityChip}${catChip}${createdChip}${doneChip}${photoBadge}${subBadge}</div>
        ${progressHtml}
      </div>
      <div class="expand-caret${isOpen?' open':''}">▶</div>
    </div>
    <div class="todo-detail${isOpen?' open':''}" id="detail-${t.id}">

      <div class="detail-section">
        <div class="detail-label">✏️ 내용 / 카테고리 / 우선순위</div>
        <input type="text" class="edit-inline" id="edit-content-${t.id}" value="${escapeAttr(t.content)}">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select id="edit-cat-${t.id}" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem">${catOptions}</select>
          <div class="priority-picker">
            <span class="prio-opt${t.priority==='red'?' selected':''}" data-p="red" onclick="setEditPriority(${t.id}, 'red', this)"><span class="prio-dot red"></span>급함</span>
            <span class="prio-opt${t.priority==='yellow'?' selected':''}" data-p="yellow" onclick="setEditPriority(${t.id}, 'yellow', this)"><span class="prio-dot yellow"></span>보통</span>
            <span class="prio-opt${t.priority==='green'?' selected':''}" data-p="green" onclick="setEditPriority(${t.id}, 'green', this)"><span class="prio-dot green"></span>여유</span>
          </div>
          <span style="font-size:.78rem;color:var(--blue);font-weight:700;cursor:pointer;margin-left:auto" onclick="saveTodoEdit(${t.id})">저장</span>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">📊 진행률 (예: 청구작업 1000~1086 중 어디까지)</div>
        <div class="progress-editor">
          시작 <input type="number" id="prog-start-${t.id}" value="${t.progress_start ?? ''}">
          끝 <input type="number" id="prog-end-${t.id}" value="${t.progress_end ?? ''}">
          현재 <input type="number" id="prog-cur-${t.id}" value="${t.progress_current ?? ''}">
          <button onclick="saveProgress(${t.id})">저장</button>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">☑️ 체크리스트</div>
        <div class="sub-list">${subitemsHtml || ''}</div>
        <div class="sub-add-row">
          <input type="text" id="sub-input-${t.id}" placeholder="작은 단계 추가 (예: 1000~1020번 확인)" onkeydown="if(event.key==='Enter')addSubitem(${t.id})">
          <button onclick="addSubitem(${t.id})">추가</button>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">📷 사진 (HEIC/JPG/PNG)</div>
        <div class="photo-grid">
          ${photosHtml}
          <label class="photo-add-label">＋<input type="file" accept=".jpg,.jpeg,.png,.heic,.heif,image/*" onchange="uploadMedia(${t.id}, this)"></label>
        </div>
      </div>

      <div class="detail-footer">
        <span class="danger" onclick="deleteTodo(${t.id})">🗑️ 이 할 일 삭제</span>
      </div>
    </div>
  </div>`;
}

function escapeHtml(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function toggleExpand(id){
  if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
  renderTodos();
}

async function addTodo(){
  const input = document.getElementById('newTodoInput');
  const content = input.value.trim();
  if(!content) return;
  const category_id = document.getElementById('newCategorySelect').value || null;
  const r = await authFetch('/todo', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content, todo_date: currentDate, category_id: category_id ? Number(category_id) : null, priority: newPriority})
  });
  if(!r.ok){ alert('추가 실패'); return; }
  input.value = '';
  newPriority = null;
  document.querySelectorAll('#newPriorityPicker .prio-opt').forEach(el=>el.classList.remove('selected'));
  loadTodos();
}

async function toggleTodo(id){
  await authFetch(`/todo/${id}/toggle`, {method:'PATCH'});
  loadTodos();
}

async function deleteTodo(id){
  if(!confirm('삭제할까요?')) return;
  await authFetch(`/todo/${id}`, {method:'DELETE'});
  expandedIds.delete(id);
  loadTodos();
}

function setEditPriority(id, p, el){
  const card = document.querySelector(`.todo-card[data-id="${id}"]`);
  const isSelected = el.classList.contains('selected');
  card.querySelectorAll('.todo-detail .priority-picker .prio-opt').forEach(x=>x.classList.remove('selected'));
  if(!isSelected) el.classList.add('selected');
  card.dataset.editPriority = isSelected ? '' : p;
}

async function saveTodoEdit(id){
  const content = document.getElementById(`edit-content-${id}`).value.trim();
  if(!content){ alert('내용을 입력해주세요'); return; }
  const category_id = document.getElementById(`edit-cat-${id}`).value || null;
  const card = document.querySelector(`.todo-card[data-id="${id}"]`);
  const selectedOpt = card.querySelector('.todo-detail .priority-picker .prio-opt.selected');
  const priority = selectedOpt ? selectedOpt.dataset.p : null;
  const t = currentList.find(x=>x.id===id) || {};
  await authFetch(`/todo/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      content, category_id: category_id ? Number(category_id) : null, priority,
      progress_start: t.progress_start, progress_end: t.progress_end, progress_current: t.progress_current,
    })
  });
  loadTodos();
}

async function saveProgress(id){
  const start = document.getElementById(`prog-start-${id}`).value;
  const end = document.getElementById(`prog-end-${id}`).value;
  const cur = document.getElementById(`prog-cur-${id}`).value;
  const t = currentList.find(x=>x.id===id) || {};
  await authFetch(`/todo/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      content: t.content, category_id: t.category_id, priority: t.priority,
      progress_start: start===''?null:Number(start),
      progress_end: end===''?null:Number(end),
      progress_current: cur===''?null:Number(cur),
    })
  });
  loadTodos();
}

// ── 체크리스트 ──
async function addSubitem(todoId){
  const input = document.getElementById(`sub-input-${todoId}`);
  const content = input.value.trim();
  if(!content) return;
  await authFetch(`/todo/${todoId}/subitems`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content})});
  loadTodos();
}
async function toggleSubitem(todoId, subId){
  await authFetch(`/todo/subitems/${subId}/toggle`, {method:'PATCH'});
  loadTodos();
}
async function deleteSubitem(todoId, subId){
  await authFetch(`/todo/subitems/${subId}`, {method:'DELETE'});
  loadTodos();
}

// ── 사진 ──
async function uploadMedia(todoId, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const r = await authFetch(`/todo/${todoId}/media`, {method:'POST', body: fd});
  if(!r.ok){
    const d = await r.json().catch(()=>({}));
    alert(d.detail || '사진 업로드 실패');
  }
  inputEl.value = '';
  loadTodos();
}
async function deleteMedia(todoId, mediaId){
  await authFetch(`/todo/media/${mediaId}`, {method:'DELETE'});
  loadTodos();
}

// ── 스프레드시트 연동 ──
async function exportTodos(format){
  const r = await authFetch(`/todo/export?format=${format}`);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `todo_export.${format}`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function importTodos(){
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files[0];
  if(!file) return;
  const msg = document.getElementById('ioMsg');
  msg.textContent = '가져오는 중...';
  const fd = new FormData();
  fd.append('file', file);
  try{
    const r = await authFetch(`/todo/import?default_date=${currentDate}`, {method:'POST', body: fd});
    const d = await r.json();
    if(!r.ok){ msg.textContent = d.detail || '가져오기 실패'; return; }
    msg.textContent = d.message;
    loadTodos();
  }catch(e){
    msg.textContent = '가져오기 중 오류가 발생했습니다';
  }
  fileInput.value = '';
}
</script>

</body>
</html>
