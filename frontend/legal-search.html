    --bg:#FFFFFF;--panel:#F5F5F7;--line:#D2D2D7;
    --good:#0071E3;--warn:#B36B00;--bad:#D93025;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--black);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  nav{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);display:flex;justify-content:center;
  }
  .nav-inner{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:48px;font-size:.82rem;font-weight:500}
  .nav-links{display:flex;gap:24px;align-items:center;color:var(--gray)}
  .nav-links a{color:var(--gray);text-decoration:none}
  .nav-links .active{color:var(--black)}
  .nav-links .greet{color:var(--black);font-weight:600}
  .logout-link{color:var(--blue);cursor:pointer}

  main{max-width:760px;margin:0 auto;padding:0 24px 100px}

  .page-header{padding:36px 0 6px}
  .page-header h1{font-size:1.5rem;font-weight:700}
  .page-header p{font-size:.85rem;color:var(--gray);margin-top:6px}

  .search-box{display:flex;gap:8px;margin:22px 0 6px}
  .search-box input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:.92rem;outline:none;font-family:inherit}
  .search-box input:focus{border-color:var(--blue)}
  .search-box button{background:var(--black);color:#fff;border:none;border-radius:12px;padding:0 22px;font-size:.9rem;font-weight:600;cursor:pointer}
  .search-box button:disabled{opacity:.5;cursor:default}
  .search-box .card-btn{background:#FEE500;color:#191919;padding:0 16px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .search-box .card-btn svg{flex-shrink:0}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;
    padding:12px 18px;border-radius:12px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ .search-box .card-btn span{display:none} .search-box .card-btn{padding:0 14px} }
  .hint{font-size:.76rem;color:var(--gray-light);margin-bottom:18px}
  .hint b{color:var(--gray)}

  .state-msg{padding:40px 0;text-align:center;color:var(--gray);font-size:.9rem}

  .keywords{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 22px}
  .keywords span{background:var(--panel);border-radius:980px;padding:5px 12px;font-size:.76rem;color:var(--gray)}

  .section-title{font-size:1rem;font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
  .section-title .count{font-size:.76rem;color:var(--gray-light);font-weight:500}

  .card{background:var(--panel);border-radius:16px;padding:18px 20px;margin-bottom:12px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .card-title{font-size:.94rem;font-weight:700;line-height:1.4}
  .card-meta{font-size:.76rem;color:var(--gray-light);white-space:nowrap;flex-shrink:0;margin-top:2px}
  .card-body{font-size:.85rem;color:var(--gray);line-height:1.65;white-space:pre-wrap}
  .card-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .card-more{font-size:.78rem;color:var(--blue);cursor:pointer;margin-top:8px;display:inline-block}
  .card-link{font-size:.78rem;color:var(--blue);text-decoration:none;margin-top:10px;display:inline-block}

  .ref-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
  .ref-card .ref-title{font-size:.9rem;font-weight:700;color:var(--blue);margin-bottom:6px}
  .ref-card .ref-body{font-size:.83rem;color:var(--gray);line-height:1.7;white-space:pre-wrap}

  .disclaimer{margin-top:32px;padding:16px 18px;background:var(--panel);border-radius:14px;font-size:.78rem;color:var(--gray-light);line-height:1.6}
  .breadcrumb-bar{background:var(--panel);border-bottom:1px solid var(--line)}
  .breadcrumb{max-width:980px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--gray)}
  .breadcrumb a{color:var(--gray);text-decoration:none}
  .breadcrumb a:hover{color:var(--black)}
  .breadcrumb .crumb-sep{color:var(--line)}
  .breadcrumb .crumb-current{color:var(--black);font-weight:600}

<main>
  <div class="page-header">
    <h1>법령검색</h1>
    <p>상황을 문장으로 입력하면, 관련 조문 · 판례 · 법령해석례를 찾아드립니다.</p>
  </div>

  <div class="search-box">
    <input id="q" type="text" placeholder="예: 환자 동의 없이 진료기록을 공유했어요" maxlength="500"
           onkeydown="if(event.key==='Enter') runSearch()">
    <button id="searchBtn" onclick="runSearch()">검색</button>
    <button id="cardBtn" class="card-btn" onclick="sendKakaoCard()" disabled title="검색 결과 핵심을 내 카카오톡으로 받기">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7l-1 3.6c-.1.4.3.7.6.5l4.3-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>
      <span>카드뉴스</span>
    </button>
  </div>
  <div class="hint">키워드 기반 검색입니다. <b>법률 자문이 아니며</b>, 참고용으로만 활용해주세요.</div>

  <div id="result"></div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if(!token){ location.href = '/login.html'; }

function logout(){ localStorage.clear(); location.href = '/login.html'; }

async function authFetch(path, opts={}){
  opts.headers = Object.assign({}, opts.headers, {'Authorization':'Bearer '+token});
  const r = await fetch(API + path, opts);
  if(r.status === 401){ logout(); throw new Error('unauthorized'); }
  return r;
}

(async function init(){
  try{
    const r = await authFetch('/auth/me');
    const me = await r.json();
    document.getElementById('greetName').textContent = me.full_name + '님';
    if(me.role === 'admin'){
      document.getElementById('usersNavLink').style.display = 'inline';
      document.getElementById('annNavLink').style.display = 'inline';
    }
  }catch(e){}
})();

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function precCard(p){
  const body = p.summary || p.held || '';
  const bodyId = 'prec-' + p.id;
  return `
    <div class="card">
      <div class="card-top">
        <div class="card-title">${escapeHtml(p.title)}</div>
        <div class="card-meta">${escapeHtml(p.case_type || '')}</div>
      </div>
      <div class="card-meta" style="margin-bottom:8px">${escapeHtml(p.source_label)}</div>
      <div class="card-body clamp" id="${bodyId}">${escapeHtml(body)}</div>
      <span class="card-more" onclick="document.getElementById('${bodyId}').classList.toggle('clamp'); this.textContent = this.textContent==='더 보기'?'접기':'더 보기'">더 보기</span>
      ${p.link ? `<a class="card-link" href="https://www.law.go.kr${p.link}" target="_blank" rel="noopener">law.go.kr에서 원문 보기 →</a>` : ''}
    </div>`;
}

function expcCard(e){
  const bodyId = 'expc-' + e.id;
  const body = (e.question ? '[질의]\n' + e.question + '\n\n' : '') + (e.answer ? '[회답]\n' + e.answer : '');
  return `
    <div class="card">
      <div class="card-top">
        <div class="card-title">${escapeHtml(e.title)}</div>
      </div>
      <div class="card-meta" style="margin-bottom:8px">${escapeHtml(e.source_label)}</div>
      <div class="card-body clamp" id="${bodyId}">${escapeHtml(body)}</div>
      <span class="card-more" onclick="document.getElementById('${bodyId}').classList.toggle('clamp'); this.textContent = this.textContent==='더 보기'?'접기':'더 보기'">더 보기</span>
      ${e.link ? `<a class="card-link" href="https://www.law.go.kr${e.link}" target="_blank" rel="noopener">law.go.kr에서 원문 보기 →</a>` : ''}
    </div>`;
}

function refCard(a){
  return `
    <div class="ref-card">
      <div class="ref-title">${escapeHtml(a.ref)}${a.title ? ' · ' + escapeHtml(a.title) : ''}</div>
      <div class="ref-body">${escapeHtml(a.text)}</div>
    </div>`;
}

async function runSearch(){
  const q = document.getElementById('q').value.trim();
  const result = document.getElementById('result');
  const btn = document.getElementById('searchBtn');
  if(!q){ result.innerHTML = '<div class="state-msg error">상황을 입력해주세요.</div>'; return; }

  btn.disabled = true;
  document.getElementById('cardBtn').disabled = true;
  lastSearch = null;
  result.innerHTML = '<div class="state-msg">검색 중입니다...</div>';

  try{
    const r = await fetch(`${API}/legal-review/situation-search?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    if(!r.ok){
      result.innerHTML = `<div class="state-msg error">${escapeHtml(data.detail || '검색에 실패했습니다.')}</div>`;
      return;
    }

    lastSearch = { q, data };
    document.getElementById('cardBtn').disabled = !(
      (data.ref_articles||[]).length || (data.precedents||[]).length || (data.interpretations||[]).length);

    let html = '';
    if(data.keywords && data.keywords.length){
      html += `<div class="keywords">${data.keywords.map(k=>`<span>${escapeHtml(k)}</span>`).join('')}</div>`;
    }
    if(data.ref_articles && data.ref_articles.length){
      html += `<div class="section-title">관련 조문 <span class="count">${data.ref_articles.length}건</span></div>`;
      html += data.ref_articles.map(refCard).join('');
    }
    if(data.precedents && data.precedents.length){
      html += `<div class="section-title">관련 판례 <span class="count">${data.precedents.length}건</span></div>`;
      html += data.precedents.map(precCard).join('');
    }
    if(data.interpretations && data.interpretations.length){
      html += `<div class="section-title">관련 법령해석례 <span class="count">${data.interpretations.length}건</span></div>`;
      html += data.interpretations.map(expcCard).join('');
    }
    html += `<div class="disclaimer">${escapeHtml(data.disclaimer)}</div>`;
    result.innerHTML = html;
  }catch(e){
    result.innerHTML = '<div class="state-msg error">검색 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>';
  }finally{
    btn.disabled = false;
  }
}
</script>
<script>
// ── 카카오톡 카드뉴스로 받기 ──
let lastSearch = null;
function showToast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.classList.remove('show'), 3200);
}
function shorten(s, n){
  s = (s||'').replace(/\s+/g,' ').trim();
  if(s.length <= n) return s;
  let cut = s.slice(0, n-1);
  const sp = cut.lastIndexOf(' ');
  if(sp >= Math.floor(n*0.6)) cut = cut.slice(0, sp);      // 단어 중간에서 끊기지 않게
  return cut.replace(/[\s·,(「\[]+$/,'') + '…';
}
const PENAL_RE = /벌칙|양벌|과태료|벌금|처벌|법률의 착오/;
// 검색어와의 관련도 점수. 첫 핵심어(서버가 가장 구체적이라고 본 낱말)가 들어 있으면 3점,
// '환자·진료·기록'처럼 어디에나 나오는 낱말만 겹치면 0.5점, 그 밖의 핵심어는 1점.
const GENERIC_KW = new Set(['환자','진료','기록','의료','병원','의사','직원','의료기관']);
function kwScore(text, kws){
  text = text || '';
  return (kws||[]).reduce((n,k,i)=> n + (k && text.includes(k) ? (GENERIC_KW.has(k) ? 0.5 : (i === 0 ? 3 : 1)) : 0), 0);
}
function pickTop(list, scoreFn){
  return list.map((x,i)=>({x, i, s: scoreFn(x)}))
             .sort((a,b)=> b.s - a.s || a.i - b.i)          // 점수 높은 순, 같으면 원래 순서 유지
             .map(o=>o.x);
}
// 긴 제목은 '앞부분…끝부분'으로 줄인다. 해석례 제목은 끝에 질문이 오는 경우가 많아서(…동의가 필요한지) 끝을 남기는 편이 뜻이 잘 보인다.
function squeeze(s, n){
  s = (s||'').replace(/\s+/g,' ').trim();
  if(s.length <= n) return s;
  const headMax = Math.floor((n-1) * 0.42);
  let head = s.slice(0, headMax);
  if(s[headMax] !== ' '){ const hsp = head.lastIndexOf(' '); if(hsp >= 4) head = head.slice(0, hsp); }   // 단어 중간에서 끊기지 않게
  const tailMax = n - 1 - head.length;
  const cutAt = s.length - tailMax;
  let tail = s.slice(cutAt);
  if(s[cutAt-1] !== ' '){ const tsp = tail.indexOf(' '); if(tsp >= 0 && tsp <= 4) tail = tail.slice(tsp+1); }
  return head + '…' + tail;
}
function shortPrec(p){
  const t = (p.title||'').trim();
  const m = t.match(/^([^\[]{1,20})\[(.+)\]\s*$/);
  const type = m ? m[1].trim() : '';
  let body = m ? m[2] : t;
  body = body.replace(/\s*(사안|사건|경우|취지|여부)$/,'');
  return shorten((type ? type + ' · ' : '') + body, 26);
}
function shortExpc(e){
  let t = (e.title || e.source_label || '').trim();
  t = t.replace(/^[^-]{1,20}\s-\s/,'');                     // "민원인 - " 같은 질의 기관 접두어 제거
  t = t.replace(/\s*\([^()]*관련\)\s*$/,'');                // 끝의 "(「법」 제N조 관련)" 제거
  t = t.replace(/「[^」]{1,20}」\s*제\d+조(?:의\d+)?(?:제\d+항)?(?:제\d+호)?(?:의|에 따른|에 따라)?\s*/g,'');   // 제목 속 "「법」 제N조…" 인용 제거
  t = t.replace(/\s*(?:에 해당하는지|인지|하는지)\s*(?:여부)?$/,'');
  t = t.replace(/\s*여부$/,'');
  return squeeze(t, 26);
}
function buildCardItems(d){
  const kws = d.keywords || [];
  // 서버가 '대표 조문'으로 붙인 조문은 top_refs 에서 count 가 0 이다
  const anchorRefs = new Set((d.top_refs||[]).filter(r => r.count === 0).map(r => r.ref));
  const arts = pickTop(d.ref_articles||[], a => PENAL_RE.test(a.title||'') ? -1 : 0);   // 서버 순서 유지, 벌칙류만 뒤로
  const anchorArts = arts.filter(a => anchorRefs.has(a.ref));
  const otherArts  = arts.filter(a => !anchorRefs.has(a.ref));
  const artText = a => shorten(a.ref + (a.title ? ' (' + a.title + ')' : ''), 26);

  // 대표 조문이 있으면 그것만(최대 3개). 2개 미만일 때만 다른 조문으로 채운다.
  let A = anchorArts.slice(0,3);
  if(A.length < 2) A = A.concat(otherArts.slice(0, 2 - A.length));

  const pText = p => (p.title||'') + ' ' + (p.summary||'').slice(0,300);
  const eText = e => (e.title||'') + ' ' + (e.question||'').slice(0,300);
  const P = pickTop(d.precedents||[], p => kwScore(pText(p), kws));
  const E = pickTop(d.interpretations||[], e => kwScore(eText(e), kws));

  const items = [], seen = new Set();
  const push = (label, text) => {
    if(!text || items.length >= 5 || seen.has(label + text)) return;
    seen.add(label + text); items.push({label, text});
  };

  A.forEach(a => push('조문', artText(a)));
  // 검색어와 겹치는 낱말이 하나도 없는 판례·해석례는 넣지 않는다 (엉뚱한 사건이 핵심처럼 보이는 것 방지)
  P.filter(p => kwScore(pText(p), kws) >= 1).slice(0,1).forEach(p => push('판례', shortPrec(p)));
  E.filter(e => kwScore(eText(e), kws) >= 1).forEach(e => push('해석례', shortExpc(e)));

  // 그래도 3줄 미만이면 남은 것으로 채운다
  if(items.length < 3){
    otherArts.forEach(a => { if(items.length < 3) push('조문', artText(a)); });
    E.forEach(e => { if(items.length < 3) push('해석례', shortExpc(e)); });
    P.forEach(p => { if(items.length < 3) push('판례', shortPrec(p)); });
  }
  if(items.length < 5 && kws.length) push('키워드', shorten(kws.join(' · '), 26));
  return items;
}
async function sendKakaoCard(){
  if(!lastSearch) return;
  if(!confirm('검색 결과 핵심을 내 카카오톡(나와의 채팅)으로 보낼까요?\n\n카카오톡에 내용이 저장되니, 검색어에 환자 이름 등 개인 식별정보가 없는지 확인해 주세요.\n(주민번호·전화번호·이메일은 자동으로 가려져요)')) return;
  const btn = document.getElementById('cardBtn'); btn.disabled = true;
  const d = lastSearch.data;
  try{
    const r = await authFetch('/legal-card/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ q: lastSearch.q, items: buildCardItems(d),
        counts:{articles:(d.ref_articles||[]).length, precedents:(d.precedents||[]).length, interpretations:(d.interpretations||[]).length} })
    });
    const res = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(res.detail || '보내지 못했어요');
    showToast('카카오톡 "나와의 채팅"으로 보냈어요 💬' + (res.masked ? ' (개인정보 일부를 가렸어요)' : ''));
  }catch(e){
    showToast(e.message || '카드뉴스를 보내지 못했어요');
  }finally{
    btn.disabled = false;
  }
}
// 카드의 [검색 결과 전체 보기]로 들어오면 같은 검색어로 자동 검색
(function(){
  const q = new URLSearchParams(location.search).get('q');
  if(q){ document.getElementById('q').value = q; runSearch(); }
})();
</script>
