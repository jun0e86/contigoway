<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contigoway · 사진모음</title>
<style>
  :root{
    --black:#1D1D1F;--gray:#6E6E73;--gray-light:#86868B;--blue:#0071E3;--pink:#FF2D55;
    --bg:#FFFFFF;--panel:#F5F5F7;--line:#D2D2D7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--black);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  nav{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);display:flex;justify-content:center;
  }
  .nav-inner{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:48px;font-size:.82rem;font-weight:500}
  .nav-links{display:flex;gap:24px;align-items:center;color:var(--gray)}
  .nav-links a{color:var(--gray);text-decoration:none}
  .nav-links .active{color:var(--black)}
  .nav-links .greet{color:var(--black);font-weight:600}
  .logout-link{color:var(--blue);cursor:pointer}

  main{max-width:900px;margin:0 auto;padding:0 24px 100px}

  .page-header{display:flex;justify-content:space-between;align-items:center;padding:36px 0 18px}
  .page-header h1{font-size:1.5rem;font-weight:700}
  .new-btn{background:var(--black);color:#fff;border:none;border-radius:980px;padding:9px 18px;font-size:.85rem;font-weight:600;cursor:pointer}

  .search-row{display:flex;gap:8px;margin-bottom:12px}
  .search-row input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:.88rem;outline:none;font-family:inherit}
  .search-row input:focus{border-color:var(--blue)}
  .search-row button{background:var(--panel);border:none;border-radius:12px;padding:0 16px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--black)}
  .cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .cat-chip{background:var(--panel);border:none;border-radius:980px;padding:6px 14px;font-size:.78rem;font-weight:600;color:var(--gray);cursor:pointer}
  .cat-chip.active{background:var(--black);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .vid-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:6px}
  .thumb .occ-badge{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.7rem;padding:14px 8px 6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty-msg{padding:60px 0;text-align:center;color:var(--gray);font-size:.9rem}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px}
  .overlay.open{display:flex}
  .sheet{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:26px;margin-top:20px}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .sheet-header h2{font-size:1.05rem;font-weight:700}
  .sheet-close{cursor:pointer;color:var(--gray);font-size:1.3rem;background:none;border:none}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;color:var(--gray);margin-bottom:5px;font-weight:600}
  .field input, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.88rem;outline:none;font-family:inherit}
  .field textarea{min-height:60px;resize:vertical}
  .field input:focus, .field textarea:focus{border-color:var(--blue)}

  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin:10px 0}
  .preview-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel)}
  .preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}
  .preview-item .remove{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer}
  .preview-item .no-preview{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem}

  .btn-primary{width:100%;padding:12px;background:var(--black);color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .btn-secondary{padding:10px 14px;background:var(--panel);color:var(--black);border:none;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer}
  .btn-danger{padding:10px 14px;background:#fff;color:#D93025;border:1px solid #F3C0C0;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer}

  .detail-media img,.detail-media video{width:100%;border-radius:14px;display:block;max-height:60vh;object-fit:contain;background:#000}
  .meta-row{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:.85rem;color:var(--black)}
  .meta-row .ico{width:20px;flex-shrink:0;text-align:center}
  .meta-row .sub{color:var(--gray);font-size:.78rem}
  .detail-actions{display:flex;gap:8px;margin-top:18px}

  .comments{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  .comments h3{font-size:.85rem;font-weight:700;margin-bottom:10px}
  .comment-item{background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .comment-item .c-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
  .comment-item .c-author{font-size:.78rem;font-weight:700}
  .comment-item .c-del{background:none;border:none;color:var(--gray-light);font-size:.72rem;cursor:pointer}
  .comment-item .c-content{font-size:.85rem;line-height:1.5;white-space:pre-wrap}
  .comment-empty{color:var(--gray-light);font-size:.8rem;margin-bottom:10px}
  .comment-form{display:flex;gap:6px;margin-top:10px}
  .comment-form input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:980px;font-size:.85rem;outline:none;font-family:inherit}
  .comment-form input:focus{border-color:var(--blue)}
  .comment-form button{background:var(--black);color:#fff;border:none;border-radius:980px;padding:0 16px;font-size:.82rem;font-weight:600;cursor:pointer}
  .emoji-btn{background:var(--panel);border:none;border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;flex-shrink:0}
  .emoji-picker{position:relative}
  .emoji-popup{display:none;position:absolute;bottom:44px;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;width:220px;grid-template-columns:repeat(7,1fr);gap:2px;z-index:10}
  .emoji-popup.open{display:grid}
  .emoji-popup button{background:none;border:none;font-size:1.15rem;padding:5px;cursor:pointer;border-radius:6px}
  .emoji-popup button:hover{background:var(--panel)}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/index.html" class="brand" style="text-decoration:none;color:inherit;font-weight:600;display:flex;align-items:center;gap:8px">
      <svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true" style="flex-shrink:0">
        <rect width="34" height="34" rx="9" fill="#0071E3"/>
        <path d="M9 24 C9 24 11 14 17 12 C23 10 25 14 25 14" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M22.2 11.2 c0-1.3 1-2 2-2 s2 0.7 2 2 c0 1.6 -2 3.2 -2 3.2 s-2 -1.6 -2 -3.2 z" fill="#fff"/>
      </svg>
      <span>contigo<span style="color:#0071E3">way</span></span>
    </a>
    <div class="nav-links">
      <a href="/index.html?ann=1" id="annNavLink" style="display:none">📢 공지관리</a>
      <a href="/index.html">여행</a>
      <span class="active">사진모음</span>
      <a href="/diary.html">일기</a>
      <a href="/todo.html">TODO</a>
      <a href="/legal-search.html">법령검색</a>
      <a href="/schedule.html">스케줄</a>
      <a href="/users.html" id="usersNavLink" style="display:none">사용자 관리</a>
      <span class="greet" id="greetName"></span>
      <span class="logout-link" onclick="logout()">로그아웃</span>
    </div>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>사진모음</h1>
    <button class="new-btn" onclick="openUploader()">+ 업로드</button>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="장소나 태그로 검색 (예: 노원, 일본)"
           onkeydown="if(event.key==='Enter') runSearch()">
    <button onclick="runSearch()">검색</button>
  </div>
  <div class="cat-row" id="catRow"></div>
  <div id="resultCount" style="font-size:.8rem;color:var(--gray);margin-bottom:10px"></div>

  <div id="grid" class="grid"></div>
  <div id="emptyMsg" class="empty-msg" style="display:none">아직 업로드된 사진이 없어요.</div>
</main>

<!-- 업로드 -->
<div class="overlay" id="uploadOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>사진 업로드</h2>
      <button class="sheet-close" onclick="closeUploader()">✕</button>
    </div>
    <div class="field">
      <label>사진 / 동영상 (JPEG, HEIC, PNG, MOV — 여러 개 선택 가능)</label>
      <input type="file" id="fFiles" multiple accept=".jpg,.jpeg,.png,.heic,.heif,.mov" onchange="onFilesPicked(event)">
    </div>
    <div class="preview-grid" id="previewGrid"></div>
    <div class="field">
      <label>카테고리 (예: 일상, 여름휴가, 해외여행 — 직접 입력도 가능)</label>
      <input type="text" id="fCategory" list="categoryOptions" maxlength="50" placeholder="예: 해외여행">
      <datalist id="categoryOptions"></datalist>
    </div>
    <div class="field">
      <label>무슨 일로 찍었나요? (예: 생일, 오타루 여행, 그냥 일상)</label>
      <input type="text" id="fOccasion" maxlength="500" placeholder="선택한 사진 전체에 함께 적용됩니다">
    </div>
    <button class="btn-primary" id="uploadBtn" onclick="submitUpload()">업로드</button>
  </div>
</div>

<!-- 상세 -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>사진 상세</h2>
      <button class="sheet-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-media" id="detailMedia"></div>
    <div id="detailMeta"></div>
    <div class="detail-actions" id="detailActions"></div>
    <div class="comments">
      <h3>댓글</h3>
      <div id="commentList"></div>
      <div class="comment-form">
        <input type="text" id="commentInput" placeholder="댓글을 남겨보세요" maxlength="1000"
               onkeydown="if(event.key==='Enter') submitComment()">
        <div class="emoji-picker">
          <button type="button" class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
          <div class="emoji-popup" id="emojiPopup"></div>
        </div>
        <button onclick="submitComment()">등록</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if(!token){ location.href = '/login.html'; }

function logout(){ localStorage.clear(); location.href = '/login.html'; }

async function authFetch(path, opts={}){
  opts.headers = Object.assign({}, opts.headers, {'Authorization':'Bearer '+token});
  const r = await fetch(API + path, opts);
  if(r.status === 401){ logout(); throw new Error('unauthorized'); }
  return r;
}

let me = null;
let currentQuery = '';
let currentCategory = '';
(async function init(){
  try{
    const r = await authFetch('/auth/me');
    me = await r.json();
    document.getElementById('greetName').textContent = me.full_name + '님';
    if(me.role === 'admin'){
      document.getElementById('usersNavLink').style.display = 'inline';
      document.getElementById('annNavLink').style.display = 'inline';
    }
  }catch(e){}
  await loadCategories();
  await loadGrid();
})();

// WMO 날씨코드 -> 이모지/설명 (Open-Meteo 기준, diary와 동일 체계)
const WEATHER_MAP = {
  0:['☀️','맑음'], 1:['🌤️','대체로 맑음'], 2:['⛅','부분 흐림'], 3:['☁️','흐림'],
  45:['🌫️','안개'], 48:['🌫️','안개'], 51:['🌦️','이슬비'], 53:['🌦️','이슬비'], 55:['🌦️','이슬비'],
  61:['🌧️','비'], 63:['🌧️','비'], 65:['🌧️','강한 비'], 71:['🌨️','눈'], 73:['🌨️','눈'], 75:['❄️','강한 눈'],
  80:['🌦️','소나기'], 81:['🌦️','소나기'], 82:['⛈️','강한 소나기'], 95:['⛈️','뇌우'], 96:['⛈️','뇌우'], 99:['⛈️','뇌우'],
};
function weatherLabel(code, tmax, tmin){
  if(code === null || code === undefined) return null;
  const [emoji, desc] = WEATHER_MAP[code] || ['🌡️','-'];
  const temp = (tmax !== null && tmin !== null) ? `${tmin}° ~ ${tmax}°` : '';
  return `${emoji} ${desc}${temp ? ' · ' + temp : ''}`;
}
function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', {year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fileUrl(relPath){ return '/uploads/' + relPath; }

let allPhotos = [];
async function loadGrid(){
  const params = new URLSearchParams({limit: '200'});
  if(currentQuery) params.set('q', currentQuery);
  if(currentCategory) params.set('category', currentCategory);
  const r = await authFetch('/photos?' + params.toString());
  allPhotos = await r.json();
  const grid = document.getElementById('grid');
  document.getElementById('emptyMsg').style.display = allPhotos.length ? 'none' : 'block';
  document.getElementById('emptyMsg').textContent = (currentQuery || currentCategory)
    ? '조건에 맞는 사진이 없어요.' : '아직 업로드된 사진이 없어요.';
  document.getElementById('resultCount').textContent = allPhotos.length + '건 조회완료';
  grid.innerHTML = allPhotos.map(p => {
    const thumbSrc = fileUrl(p.thumbnail_path || p.file_path);
    const inner = p.media_type === 'video'
      ? `<video src="${fileUrl(p.file_path)}" muted></video><span class="vid-badge">MOV</span>`
      : `<img src="${thumbSrc}" loading="lazy">`;
    const occ = p.occasion ? `<span class="occ-badge">${escapeHtml(p.occasion)}</span>` : '';
    return `<div class="thumb" onclick="openDetail(${p.id})">${inner}${occ}</div>`;
  }).join('');
}

function runSearch(){
  currentQuery = document.getElementById('searchInput').value.trim();
  loadGrid();
}

async function loadCategories(){
  const r = await authFetch('/photos/categories');
  const cats = await r.json();
  document.getElementById('categoryOptions').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
  const presets = ['일상', '여름휴가', '해외여행'];
  const merged = [...presets, ...cats.filter(c => !presets.includes(c))];
  renderCatChips(merged);
}
function renderCatChips(cats){
  const row = document.getElementById('catRow');
  const chips = ['', ...cats];
  row.innerHTML = chips.map(c => {
    const label = c || '전체';
    const active = c === currentCategory ? ' active' : '';
    return `<button class="cat-chip${active}" onclick="selectCategory('${c.replace(/'/g, "\\'")}')">${escapeHtml(label)}</button>`;
  }).join('');
}
function selectCategory(c){
  currentCategory = c;
  document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  loadGrid();
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 업로드 ──
let selectedFiles = [];
function openUploader(){
  selectedFiles = [];
  document.getElementById('fFiles').value = '';
  document.getElementById('fOccasion').value = '';
  document.getElementById('fCategory').value = '';
  renderPreviews();
  document.getElementById('uploadOverlay').classList.add('open');
}
function closeUploader(){ document.getElementById('uploadOverlay').classList.remove('open'); }

function onFilesPicked(e){
  const files = Array.from(e.target.files || []);
  for(const file of files){
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const isVideo = ext === 'mov';
    const url = (ext === 'heic' || ext === 'heif') ? null : URL.createObjectURL(file);
    selectedFiles.push({file, ext, isVideo, url});
  }
  renderPreviews();
}
function renderPreviews(){
  document.getElementById('previewGrid').innerHTML = selectedFiles.map((f, i) => {
    let inner;
    if(f.isVideo) inner = `<video src="${f.url}"></video>`;
    else if(f.url) inner = `<img src="${f.url}">`;
    else inner = `<div class="no-preview">🖼️</div>`;
    return `<div class="preview-item">${inner}<button type="button" class="remove" onclick="removeFile(${i})">✕</button></div>`;
  }).join('');
}
function removeFile(i){ selectedFiles.splice(i,1); renderPreviews(); }

async function submitUpload(){
  if(!selectedFiles.length){ alert('사진 또는 동영상을 선택해주세요'); return; }
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = '업로드 중... (촬영 위치·날씨 조회 포함, 조금 걸릴 수 있어요)';
  try{
    const fd = new FormData();
    selectedFiles.forEach(f => fd.append('files', f.file));
    const occasion = document.getElementById('fOccasion').value.trim();
    if(occasion) fd.append('occasion', occasion);
    const category = document.getElementById('fCategory').value.trim();
    if(category) fd.append('category', category);
    const r = await authFetch('/photos', {method:'POST', body: fd});
    if(!r.ok){ const d = await r.json().catch(()=>({})); alert(d.detail || '업로드에 실패했습니다'); return; }
    closeUploader();
    await loadCategories();
    await loadGrid();
  } finally {
    btn.disabled = false;
    btn.textContent = '업로드';
  }
}

// ── 상세 ──
let currentDetailId = null;
function openDetail(id){
  currentDetailId = id;
  const p = allPhotos.find(x => x.id === id);
  if(!p) return;
  const media = p.media_type === 'video'
    ? `<video src="${fileUrl(p.file_path)}" controls></video>`
    : `<img src="${fileUrl(p.file_path)}">`;
  document.getElementById('detailMedia').innerHTML = media;

  const rows = [];
  const taken = fmtDate(p.taken_at);
  if(taken) rows.push(['🗓️', taken]);
  if(p.location_name) rows.push(['📍', p.location_name, (p.latitude && p.longitude) ? `${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}` : null]);
  const w = weatherLabel(p.weather_code, p.weather_temp_max, p.weather_temp_min);
  if(w) rows.push(['🌡️', w]);
  if(p.occasion) rows.push(['🏷️', p.occasion]);
  if(p.uploader_name) rows.push(['👤', p.uploader_name + '님이 업로드']);

  document.getElementById('detailMeta').innerHTML = rows.map(([ico, main, sub]) => `
    <div class="meta-row"><div class="ico">${ico}</div><div><div>${escapeHtml(main)}</div>${sub ? `<div class="sub">${escapeHtml(sub)}</div>` : ''}</div></div>
  `).join('') || '<div class="meta-row"><div class="ico">ℹ️</div><div>추가 정보가 없어요.</div></div>';

  const canManage = me && (me.role === 'admin' || p.uploader_id === me.id);
  document.getElementById('detailActions').innerHTML = canManage
    ? `<button class="btn-secondary" onclick="editOccasion(${p.id})">태그 수정</button>
       <button class="btn-danger" onclick="deletePhoto(${p.id})">삭제</button>`
    : '';

  renderComments(p);
  document.getElementById('commentInput').value = '';
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('open'); currentDetailId = null; }

function renderComments(p){
  const list = document.getElementById('commentList');
  const comments = p.comments || [];
  if(!comments.length){
    list.innerHTML = '<div class="comment-empty">아직 댓글이 없어요.</div>';
    return;
  }
  list.innerHTML = comments.map(c => {
    const canDelete = me && (me.role === 'admin' || c.user_id === me.id);
    return `<div class="comment-item">
      <div class="c-head">
        <span class="c-author">${escapeHtml(c.author_name || '알 수 없음')}</span>
        ${canDelete ? `<button class="c-del" onclick="deleteComment(${p.id}, ${c.id})">삭제</button>` : ''}
      </div>
      <div class="c-content">${escapeHtml(c.content)}</div>
    </div>`;
  }).join('');
}

function _replacePhotoInList(updated){
  const idx = allPhotos.findIndex(x => x.id === updated.id);
  if(idx >= 0) allPhotos[idx] = updated;
}

async function submitComment(){
  const input = document.getElementById('commentInput');
  const content = input.value.trim();
  if(!content || !currentDetailId) return;
  const r = await authFetch(`/photos/${currentDetailId}/comments`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content}),
  });
  if(!r.ok){ alert('댓글 등록에 실패했습니다'); return; }
  const updated = await r.json();
  _replacePhotoInList(updated);
  renderComments(updated);
  input.value = '';
}

async function deleteComment(photoId, commentId){
  if(!confirm('댓글을 삭제할까요?')) return;
  const r = await authFetch(`/photos/${photoId}/comments/${commentId}`, {method:'DELETE'});
  if(!r.ok){ alert('댓글 삭제에 실패했습니다'); return; }
  const updated = await r.json();
  _replacePhotoInList(updated);
  renderComments(updated);
}

const EMOJI_LIST = [
  '😀','😁','😂','🤣','😊','😍','🥰','😘','😎','🤩',
  '😅','😇','🙂','😉','😋','😜','🤔','😐','😴','😭',
  '😢','😡','🥺','😱','🙄','😏','👍','👎','👏','🙌',
  '🙏','💪','❤️','💕','💖','💗','💛','🧡','💜','🖤',
  '✨','🎉','🎊','🔥','⭐','🌟','☀️','🌈','🌙','⛄',
  '🍀','🌸','🌺','🍎','🍕','🍔','🍰','☕','🍺','🍾',
  '✈️','🚗','🏖️','🏔️','📸','💯','✅','❓','❗','💤',
];
let emojiPopupInited = false;
function toggleEmojiPicker(){
  const popup = document.getElementById('emojiPopup');
  if(!emojiPopupInited){
    popup.innerHTML = EMOJI_LIST.map(e => `<button type="button" onclick="insertEmoji('${e}')">${e}</button>`).join('');
    emojiPopupInited = true;
  }
  popup.classList.toggle('open');
}
function insertEmoji(emoji){
  const input = document.getElementById('commentInput');
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
  input.focus();
  const pos = start + emoji.length;
  input.setSelectionRange(pos, pos);
  document.getElementById('emojiPopup').classList.remove('open');
}
document.addEventListener('click', (e) => {
  const picker = document.querySelector('.emoji-picker');
  if(picker && !picker.contains(e.target)) document.getElementById('emojiPopup').classList.remove('open');
});

async function editOccasion(id){
  const p = allPhotos.find(x => x.id === id);
  const next = prompt('태그/메모를 입력하세요', p.occasion || '');
  if(next === null) return;
  const r = await authFetch(`/photos/${id}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({occasion: next}),
  });
  if(!r.ok){ alert('수정에 실패했습니다'); return; }
  closeDetail();
  await loadGrid();
}

async function deletePhoto(id){
  if(!confirm('이 사진을 삭제할까요? 되돌릴 수 없습니다.')) return;
  const r = await authFetch(`/photos/${id}`, {method:'DELETE'});
  if(!r.ok && r.status !== 204){ alert('삭제에 실패했습니다'); return; }
  closeDetail();
  await loadGrid();
}
