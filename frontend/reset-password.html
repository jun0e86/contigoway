<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Contigoway · 새 암호 설정</title>
<style>
  :root{--black:#1D1D1F;--gray:#6E6E73;--blue:#0071E3;--panel:#F5F5F7;--line:#D2D2D7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:var(--panel);color:var(--black);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px}
  .card{background:#fff;border-radius:22px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.06)}
  @media (max-width:440px){ .card{padding:36px 24px} }
  .logo{text-align:center;font-weight:700;font-size:1.2rem;margin-bottom:22px}
  h1{font-size:1.25rem;font-weight:700;text-align:center;margin-bottom:8px}
  .sub{text-align:center;color:var(--gray);font-size:.85rem;margin-bottom:26px;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;color:var(--gray);margin-bottom:5px;font-weight:500}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;outline:none;font-family:inherit}
  .field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
  .rule{font-size:.74rem;color:var(--gray);margin-top:5px}
  .rule.ok{color:#0C7A3D}
  .btn{width:100%;padding:13px;background:var(--black);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{font-size:.82rem;padding:10px 12px;border-radius:8px;margin:12px 0;display:none;line-height:1.5}
  .msg.error{background:#FDECEC;color:#D93025;display:block}
  .msg.success{background:#E6F6EC;color:#0C7A3D;display:block}
  .back{display:block;text-align:center;margin-top:18px;color:var(--blue);font-size:.84rem;text-decoration:none}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">contigo<span style="color:#0071E3">way</span></div>
  <h1>새 암호 설정</h1>
  <p class="sub" id="sub">새로 사용할 암호를 입력해주세요.</p>

  <div id="form">
    <div class="field">
      <label for="pw1">새 암호</label>
      <input type="password" id="pw1" autocomplete="new-password">
      <div class="rule" id="rule">8자 이상</div>
    </div>
    <div class="field">
      <label for="pw2">새 암호 확인</label>
      <input type="password" id="pw2" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitReset()">
    </div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="btn" onclick="submitReset()">암호 변경</button>
  </div>

  <a class="back" href="/login.html">로그인 화면으로</a>
</div>

<script>
const API = '/api';
const params = new URLSearchParams(location.hash.slice(1));
const token = params.get('token');
history.replaceState(null, '', location.pathname);   // 토큰을 주소창·방문기록에서 제거

function showMsg(text, type){
  const el = document.getElementById('msg');
  el.textContent = text; el.className = 'msg ' + type;
}

if(!token){
  document.getElementById('sub').textContent = '링크가 올바르지 않아요. 로그인 화면에서 암호 재설정을 다시 요청해주세요.';
  document.getElementById('form').style.display = 'none';
}

document.getElementById('pw1').addEventListener('input', e=>{
  const ok = e.target.value.length >= 8;
  const r = document.getElementById('rule');
  r.textContent = ok ? '8자 이상 ✓' : '8자 이상';
  r.classList.toggle('ok', ok);
});

async function submitReset(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if(pw1.length < 8){ showMsg('암호는 8자 이상으로 입력해주세요','error'); return; }
  if(pw1 !== pw2){ showMsg('두 암호가 서로 달라요','error'); return; }
  const btn = document.getElementById('btn'); btn.disabled = true;
  try{
    const r = await fetch(API + '/auth/password-reset/confirm', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token, new_password: pw1})
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok){ showMsg(data.detail || '암호를 변경하지 못했어요','error'); btn.disabled = false; return; }
    document.getElementById('form').innerHTML = '';
    document.getElementById('sub').textContent = data.message;
  }catch(e){
    showMsg('서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요','error'); btn.disabled = false;
  }
}
</script>
</body>
</html>
