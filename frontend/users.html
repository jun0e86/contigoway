<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contigoway · 사용자 관리</title>
<style>
  :root{
    --black:#1D1D1F;--gray:#6E6E73;--gray-light:#86868B;--blue:#0071E3;
    --bg:#FFFFFF;--panel:#F5F5F7;--line:#D2D2D7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--black);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:center}
  .nav-inner{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:48px;font-size:.82rem;font-weight:500}
  .nav-links{display:flex;gap:24px;align-items:center;color:var(--gray)}
  .nav-links a{color:var(--gray);text-decoration:none}
  .nav-links .active{color:var(--black)}
  .nav-links .greet{color:var(--black);font-weight:600}
  .logout-link{color:var(--blue);cursor:pointer}

  .breadcrumb-bar{background:var(--panel);border-bottom:1px solid var(--line)}
  .breadcrumb{max-width:980px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--gray)}
  .breadcrumb a{color:var(--gray);text-decoration:none}
  .breadcrumb a:hover{color:var(--black)}
  .breadcrumb .crumb-sep{color:var(--line)}
  .breadcrumb .crumb-current{color:var(--black);font-weight:600}

  main{max-width:760px;margin:0 auto;padding:0 24px 100px}
  .page-header{padding:36px 0 8px}
  .page-header h1{font-size:1.5rem;font-weight:700}
  .page-header p{color:var(--gray);font-size:.88rem;margin-top:4px}

  .tabs{display:flex;gap:6px;margin:22px 0 18px;border-bottom:1px solid var(--line)}
  .tab{padding:10px 4px;margin-right:20px;font-size:.88rem;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--black);border-bottom-color:var(--blue)}
  .tab .count{color:var(--gray-light);font-weight:500}

  .user-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--panel);border-radius:14px;padding:14px 18px;margin-bottom:8px;
  }
  .user-info{display:flex;flex-direction:column;gap:2px;min-width:0}
  .user-name{font-size:.92rem;font-weight:600}
  .user-meta{font-size:.78rem;color:var(--gray);word-break:break-all}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:980px;margin-left:6px;vertical-align:1px}
  .badge-admin{background:#EAF2FB;color:var(--blue)}
  .badge-pending{background:#FFF3D6;color:#946200}
  .badge-disabled{background:#FBEAEA;color:#B3261E}

  .actions{display:flex;gap:6px;flex-shrink:0}
  .actions button{border:none;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-approve{background:var(--black);color:#fff}
  .btn-reject{background:#fff;color:#B3261E;border:1px solid #F3C0C0!important}
  .btn-disable{background:#fff;color:var(--gray);border:1px solid var(--line)!important}
  .btn-enable{background:#fff;color:var(--blue);border:1px solid #BFDBFF!important}

  .empty{color:var(--gray-light);font-size:.85rem;text-align:center;padding:40px 0}
  .denied{text-align:center;padding:80px 20px;color:var(--gray)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/index.html" class="brand" style="text-decoration:none;color:inherit;font-weight:600;display:flex;align-items:center;gap:8px">
      <svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true" style="flex-shrink:0">
        <rect width="34" height="34" rx="9" fill="#0071E3"/>
        <path d="M9 24 C9 24 11 14 17 12 C23 10 25 14 25 14" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M22.2 11.2 c0-1.3 1-2 2-2 s2 0.7 2 2 c0 1.6 -2 3.2 -2 3.2 s-2 -1.6 -2 -3.2 z" fill="#fff"/>
      </svg>
      <span>contigo<span style="color:#0071E3">way</span></span>
    </a>
    <div class="nav-links">
      <a href="/index.html">홈</a>
      <span class="active">사용자 관리</span>
      <span class="greet" id="greetName"></span>
      <span class="logout-link" onclick="logout()">로그아웃</span>
    </div>
  </div>
</nav>

<div class="breadcrumb-bar">
  <div class="breadcrumb">
    <a href="/index.html">🏠 홈</a>
    <span class="crumb-sep">›</span>
    <span class="crumb-current">사용자 관리</span>
  </div>
</div>

<main id="mainArea">
  <div class="page-header">
    <h1>사용자 관리</h1>
    <p>회원가입 신청을 승인·거부하고, 전체 회원 상태를 관리해요.</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="pending" onclick="switchTab('pending')">승인 대기 <span class="count" id="cntPending"></span></div>
    <div class="tab" data-tab="active" onclick="switchTab('active')">활성 회원 <span class="count" id="cntActive"></span></div>
    <div class="tab" data-tab="disabled" onclick="switchTab('disabled')">비활성 회원 <span class="count" id="cntDisabled"></span></div>
    <div class="tab" data-tab="all" onclick="switchTab('all')">전체</div>
  </div>

  <div id="userList"></div>
</main>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if(!token){ location.href = '/login.html'; }

function logout(){ localStorage.clear(); location.href = '/login.html'; }

async function authFetch(path, opts={}){
  opts.headers = Object.assign({}, opts.headers, {'Authorization':'Bearer '+token});
  const r = await fetch(API + path, opts);
  if(r.status === 401){ logout(); throw new Error('unauthorized'); }
  return r;
}

let allUsers = [];
let currentTab = 'pending';

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function statusBadge(u){
  if(u.status === 'pending') return '<span class="badge badge-pending">승인대기</span>';
  if(u.status === 'disabled') return '<span class="badge badge-disabled">비활성</span>';
  return '';
}
function roleBadge(u){
  return u.role === 'admin' ? '<span class="badge badge-admin">관리자</span>' : '';
}

function actionsFor(u){
  if(u.status === 'pending'){
    return `
      <button class="btn-approve" onclick="doAction(${u.id},'approve')">승인</button>
      <button class="btn-reject" onclick="doAction(${u.id},'reject')">거부</button>`;
  }
  if(u.status === 'active'){
    return u.role === 'admin' ? '' : `<button class="btn-disable" onclick="doAction(${u.id},'disable')">비활성화</button>`;
  }
  if(u.status === 'disabled'){
    return `<button class="btn-enable" onclick="doAction(${u.id},'enable')">다시 활성화</button>`;
  }
  return '';
}

function renderList(){
  const box = document.getElementById('userList');
  let list = allUsers;
  if(currentTab !== 'all'){
    list = allUsers.filter(u => u.status === currentTab);
  }
  if(!list.length){
    box.innerHTML = '<div class="empty">해당하는 사용자가 없어요</div>';
    return;
  }
  box.innerHTML = list.map(u => `
    <div class="user-row">
      <div class="user-info">
        <div class="user-name">${u.full_name} ${roleBadge(u)}${statusBadge(u)}</div>
        <div class="user-meta">@${u.username} · ${u.email}${u.created_at ? ' · 가입신청 ' + fmtDate(u.created_at) : ''}</div>
      </div>
      <div class="actions">${actionsFor(u)}</div>
    </div>
  `).join('');
}

function updateCounts(){
  document.getElementById('cntPending').textContent = allUsers.filter(u=>u.status==='pending').length || '';
  document.getElementById('cntActive').textContent = allUsers.filter(u=>u.status==='active').length || '';
  document.getElementById('cntDisabled').textContent = allUsers.filter(u=>u.status==='disabled').length || '';
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderList();
}

async function loadUsers(){
  const r = await authFetch('/admin/users');
  allUsers = await r.json();
  updateCounts();
  renderList();
}

async function doAction(id, action){
  const labels = {approve:'승인', reject:'거부', disable:'비활성화', enable:'다시 활성화'};
  if((action === 'reject' || action === 'disable') && !confirm(`정말 ${labels[action]}하시겠어요?`)) return;
  const r = await authFetch(`/admin/users/${id}/${action}`, {method:'POST'});
  if(!r.ok){ alert('처리에 실패했어요'); return; }
  await loadUsers();
}

(async function init(){
  try{
    const r = await authFetch('/auth/me');
    const me = await r.json();
    document.getElementById('greetName').textContent = me.full_name + '님';
    if(me.role !== 'admin'){
      document.getElementById('mainArea').innerHTML = '<div class="denied">관리자만 볼 수 있는 페이지예요.</div>';
      return;
    }
    await loadUsers();
  }catch(e){
    document.getElementById('mainArea').innerHTML = '<div class="denied">사용자 정보를 불러오지 못했어요.</div>';
  }
})();
</script>

</body>
</html>
