<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contigoway · 로그인</title>
<style>
  :root{
    --black:#1D1D1F;--gray:#6E6E73;--blue:#0071E3;--bg:#FFFFFF;--panel:#F5F5F7;--line:#D2D2D7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:var(--panel);color:var(--black);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 16px 30px;
  }
  .card{
    background:#fff;border-radius:22px;padding:44px 40px;width:100%;max-width:400px;
    box-shadow:0 20px 50px rgba(0,0,0,.06);
  }
  @media (max-width:440px){ .card{padding:36px 24px} }
  .logo{text-align:center;font-weight:700;font-size:1.2rem;margin-bottom:6px}
  .sub{text-align:center;color:var(--gray);font-size:.85rem;margin-bottom:28px}
  .tabs{display:flex;background:var(--panel);border-radius:10px;padding:4px;margin-bottom:24px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--gray)}
  .tab.active{background:#fff;color:var(--black);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;color:var(--gray);margin-bottom:5px;font-weight:500}
  .field input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:.92rem;outline:none;font-family:inherit;
  }
  .field input:focus{border-color:var(--blue)}
  .field .hint{font-size:.72rem;color:var(--gray);margin-top:4px}
  .btn{
    width:100%;padding:13px;background:var(--black);color:#fff;border:none;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit;
  }
  .btn:hover{opacity:.88}
  .msg{font-size:.8rem;padding:9px 12px;border-radius:8px;margin:10px 0;display:none}
  .msg.error{background:#FDECEC;color:#D93025;display:block}
  .msg.success{background:#E6F6EC;color:#0C7A3D;display:block}
  .msg.info{background:var(--panel);color:var(--black);display:block}
  .screen{display:none}
  .screen.active{display:block}

  /* ── 애플식 2단계 로그인 ── */
  .login-group{border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .2s}
  .login-group:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
  .lg-row{position:relative;display:flex;align-items:center}
  .lg-row + .lg-row{border-top:1px solid var(--line)}
  .lg-row input{
    flex:1;border:none;outline:none;background:transparent;font-family:inherit;
    font-size:1rem;padding:26px 56px 10px 16px;color:var(--black);min-width:0;
  }
  .lg-row .float{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--gray);
    pointer-events:none;transition:all .15s ease;
  }
  .lg-row input:focus + .float,
  .lg-row input:not(:placeholder-shown) + .float{top:15px;font-size:.7rem}
  .arrow{
    position:absolute;right:12px;width:32px;height:32px;border-radius:50%;
    border:1.5px solid var(--gray);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:var(--gray);transition:all .15s;
  }
  .arrow:hover,.arrow.ready{border-color:var(--black);color:var(--black)}
  .arrow:disabled{opacity:.4;cursor:default}
  .arrow svg{width:14px;height:14px}
  #pwRow{max-height:0;overflow:hidden;transition:max-height .28s ease;border-top-width:0}
  .login-group.step2 #pwRow{max-height:80px;border-top-width:1px}
  .login-group.step2 #idArrow{display:none}
  .change-id{
    position:absolute;right:14px;font-size:.78rem;color:var(--blue);background:none;border:none;
    cursor:pointer;display:none;font-family:inherit;
  }
  .login-group.step2 .change-id{display:block}
  .login-group.step2 #login-username{color:var(--gray)}

  .remember{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0 4px;font-size:.88rem;cursor:pointer;user-select:none}
  .remember input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}

  .links{text-align:center;margin-top:18px;display:flex;flex-direction:column;gap:9px}
  .links button{background:none;border:none;color:var(--blue);font-size:.82rem;cursor:pointer;font-family:inherit}
  .links button:hover{text-decoration:underline}

  .divider{display:flex;align-items:center;gap:12px;margin:26px 0 16px;color:var(--gray);font-size:.78rem}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .social{display:flex;flex-direction:column;gap:10px}
  .social button{
    position:relative;width:100%;padding:14px;border:none;border-radius:12px;font-size:.92rem;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .social button svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px}
  .s-kakao{background:#FEE500;color:rgba(0,0,0,.85)}
  .s-naver{background:#03C75A;color:#fff}
  .s-apple{background:#000;color:#fff}
  .social button:hover{filter:brightness(.96)}

  .link-head{text-align:center;margin-bottom:20px}
  .link-head .badge{display:inline-flex;align-items:center;gap:6px;background:#FEE500;color:rgba(0,0,0,.85);
    font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:980px;margin-bottom:12px}
  .link-head h2{font-size:1.15rem;font-weight:700;margin-bottom:6px}
  .link-head p{font-size:.84rem;color:var(--gray);line-height:1.5}
  .link-alt{text-align:center;margin-top:16px}
  .link-alt button{background:none;border:none;color:var(--blue);font-size:.84rem;cursor:pointer;font-family:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }

  .visit-counter{
    position:fixed;top:14px;left:16px;font-size:.82rem;color:var(--black);
    background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:980px;
    display:flex;gap:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);font-weight:600;
  }
  .visit-counter:empty{display:none}
  .visit-counter b{color:var(--blue);font-weight:700}

  .ann-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .ann-overlay.open{display:flex}
  .ann-modal{background:#fff;border-radius:20px;padding:30px 28px;max-width:380px;width:100%}
  .ann-modal h3{font-size:1.05rem;font-weight:700;margin-bottom:12px}
  .ann-modal .ann-body{font-size:.88rem;line-height:1.6;color:#333;white-space:pre-wrap;margin-bottom:20px;max-height:260px;overflow-y:auto}
  .ann-footer{display:flex;justify-content:space-between;align-items:center}
  .ann-footer label{font-size:.78rem;color:var(--gray);display:flex;align-items:center;gap:5px;cursor:pointer}
  .ann-footer button{background:var(--black);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="visit-counter" id="visitCounter"></div>

<div class="card">
  <div class="logo" style="display:flex;align-items:center;justify-content:center;gap:8px">
    <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true" style="flex-shrink:0">
      <rect width="34" height="34" rx="9" fill="#0071E3"/>
      <path d="M9 24 C9 24 11 14 17 12 C23 10 25 14 25 14" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M22.2 11.2 c0-1.3 1-2 2-2 s2 0.7 2 2 c0 1.6 -2 3.2 -2 3.2 s-2 -1.6 -2 -3.2 z" fill="#fff"/>
    </svg>
    <span>contigo<span style="color:#0071E3">way</span></span>
  </div>
  <div class="sub">보경 & 준영을 위한 공간</div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">로그인</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">회원가입</div>
  </div>

  <!-- ── 로그인 ── -->
  <div class="screen active" id="screen-login">
    <form id="loginForm" autocomplete="on" onsubmit="event.preventDefault()">
      <div class="login-group" id="loginGroup">
        <div class="lg-row">
          <input type="text" id="login-username" name="username" autocomplete="username"
                 autocapitalize="off" spellcheck="false" placeholder=" " aria-label="아이디 또는 전화번호">
          <span class="float">아이디 또는 전화번호</span>
          <button type="button" class="arrow" id="idArrow" onclick="goPasswordStep()" aria-label="다음">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
          <button type="button" class="change-id" onclick="backToIdStep()">변경</button>
        </div>
        <div class="lg-row" id="pwRow">
          <input type="password" id="login-password" name="password" autocomplete="current-password"
                 placeholder=" " aria-label="비밀번호" tabindex="-1">
          <span class="float">비밀번호</span>
          <button type="button" class="arrow" id="pwArrow" onclick="doLogin()" aria-label="로그인" tabindex="-1">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </div>
      </div>
    </form>

    <div class="msg" id="login-msg"></div>

    <label class="remember"><input type="checkbox" id="rememberId"> 계정 저장</label>

    <div class="links">
      <button type="button" onclick="openFind('pw')">암호를 잊으셨나요?</button>
      <button type="button" onclick="openFind('id')">아이디를 잊으셨나요?</button>
    </div>

    <div class="divider">다른 계정으로 계속하기</div>
    <div class="social">
      <button type="button" class="s-kakao" onclick="socialLogin('kakao')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>
        카카오톡으로 계속하기
      </button>
      <button type="button" class="s-naver" onclick="socialLogin('naver')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15.6 12.8 8.1 2H2v20h6.4V11.2L15.9 22H22V2h-6.4z"/></svg>
        네이버로 계속하기
      </button>
      <button type="button" class="s-apple" onclick="socialLogin('apple')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.3 0 1.7-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.6-1-2.6-4zM13.9 5c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
        Apple로 계속하기
      </button>
    </div>
  </div>

  <!-- ── 소셜 계정 연결 (카카오 첫 로그인) ── -->
  <div class="screen" id="screen-link">
    <div class="link-head">
      <div class="badge">카카오 계정 확인됨</div>
      <h2 id="linkTitle">처음 오셨네요</h2>
      <p id="linkDesc">기존 contigoway 계정에 연결하면 다음부터 카카오로 바로 로그인돼요.</p>
    </div>

    <div id="linkExisting">
      <div class="field"><label>아이디 또는 전화번호</label><input type="text" id="link-username" autocomplete="username" autocapitalize="off"></div>
      <div class="field"><label>비밀번호</label><input type="password" id="link-password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doSocialLink()"></div>
      <div class="msg" id="link-msg"></div>
      <button class="btn" id="linkBtn" onclick="doSocialLink()">계정 연결하고 로그인</button>
      <div class="link-alt"><button type="button" onclick="showSocialRegister(true)">contigoway 계정이 없어요</button></div>
    </div>

    <div id="linkRegister" style="display:none">
      <div class="field"><label>아이디</label><input type="text" id="sreg-username" placeholder="3자 이상 영문·숫자" autocapitalize="off"></div>
      <div class="field"><label>이름</label><input type="text" id="sreg-fullname" autocomplete="name"></div>
      <div class="field"><label>이메일</label><input type="email" id="sreg-email" autocomplete="email"></div>
      <div class="field"><label>전화번호 (선택)</label><input type="tel" id="sreg-phone" placeholder="010-1234-5678" autocomplete="tel"></div>
      <div class="msg" id="sreg-msg"></div>
      <button class="btn" onclick="doSocialRegister()">가입 신청</button>
      <div class="link-alt"><button type="button" onclick="showSocialRegister(false)">기존 계정에 연결할게요</button></div>
    </div>

    <div class="link-alt"><button type="button" onclick="cancelSocialLink()" style="color:var(--gray)">취소하고 돌아가기</button></div>
  </div>

  <!-- ── 회원가입 (기존 유지) ── -->
  <div class="screen" id="screen-register">
    <div class="field"><label>아이디</label><input type="text" id="reg-username" placeholder="3자 이상" autocomplete="username"></div>
    <div class="field"><label>이름</label><input type="text" id="reg-fullname" autocomplete="name"></div>
    <div class="field"><label>이메일</label><input type="email" id="reg-email" autocomplete="email"></div>
    <div class="field">
      <label>전화번호 (선택)</label>
      <input type="tel" id="reg-phone" placeholder="010-1234-5678" autocomplete="tel">
      <div class="hint">등록하면 아이디 대신 전화번호로도 로그인할 수 있어요</div>
    </div>
    <div class="field"><label>비밀번호</label><input type="password" id="reg-password" placeholder="8자 이상" autocomplete="new-password"></div>
    <div class="msg" id="reg-msg"></div>
    <button class="btn" onclick="doRegister()">가입 신청</button>
  </div>
</div>

<div class="ann-overlay" id="annOverlay">
  <div class="ann-modal">
    <h3 id="annTitle"></h3>
    <div class="ann-body" id="annBody"></div>
    <div class="ann-footer">
      <label><input type="checkbox" id="annDontShowToday"> 오늘 하루 보지 않기</label>
      <button onclick="closeAnnouncement()">확인</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const SAVED_ID_KEY = 'saved_login_id';

/* 소셜 로그인: 백엔드 연결되면 null 대신 주소를 넣으면 바로 활성화됨 */
const SOCIAL = {
  kakao: API + '/auth/kakao/login',
  naver: null,   // 예: API + '/auth/naver/login'
  apple: null,
};
const SOCIAL_NAME = {kakao:'카카오', naver:'네이버', apple:'Apple'};

/* ── 방문자 수 (기존) ── */
(async function trackVisit(){
  try{
    await fetch(API + '/site/hit', {method:'POST'});
    const r = await fetch(API + '/site/counter');
    const d = await r.json();
    document.getElementById('visitCounter').innerHTML =
      `<span>누적 <b>${d.total.toLocaleString()}</b></span><span>오늘 <b>${d.today.toLocaleString()}</b></span>`;
  }catch(e){}
})();

/* ── 공지 팝업 (기존) ── */
(async function loadAnnouncement(){
  try{
    const r = await fetch(API + '/announcements/active');
    const ann = await r.json();
    if(!ann) return;
    const dismissKey = 'ann_dismissed_' + ann.id;
    const dismissedUntil = localStorage.getItem(dismissKey);
    if(dismissedUntil && new Date(dismissedUntil) > new Date()) return;

    document.getElementById('annTitle').textContent = ann.title;
    document.getElementById('annBody').textContent = ann.content;
    document.getElementById('annOverlay').dataset.annId = ann.id;
    document.getElementById('annOverlay').classList.add('open');
  }catch(e){}
})();

function closeAnnouncement(){
  const overlay = document.getElementById('annOverlay');
  const annId = overlay.dataset.annId;
  if(document.getElementById('annDontShowToday').checked && annId){
    const tomorrow = new Date();
    tomorrow.setHours(24,0,0,0);
    localStorage.setItem('ann_dismissed_' + annId, tomorrow.toISOString());
  }
  overlay.classList.remove('open');
}

function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}
function hideMsg(id){ document.getElementById(id).className = 'msg'; }

/* ── 2단계 로그인 ── */
const idInput = document.getElementById('login-username');
const pwInput = document.getElementById('login-password');
const group   = document.getElementById('loginGroup');

// 아이디(영문/숫자/._- 3자 이상) 또는 휴대폰번호(하이픈 허용 10~11자리)
function isValidIdentifier(v){
  const digits = v.replace(/-/g,'');
  if(/^01\d{8,9}$/.test(digits)) return true;
  return /^[A-Za-z0-9._-]{3,}$/.test(v);
}

// 존재 여부를 서버에 묻지 않는 이유: 아이디 존재 확인 API는 계정 목록 수집(열거)에 악용될 수 있음
function goPasswordStep(){
  const v = idInput.value.trim();
  if(!v){ showMsg('login-msg','아이디 또는 전화번호를 입력해주세요','error'); idInput.focus(); return; }
  if(!isValidIdentifier(v)){ showMsg('login-msg','아이디는 3자 이상 영문·숫자, 전화번호는 010으로 시작하는 번호로 입력해주세요','error'); idInput.focus(); return; }
  hideMsg('login-msg');
  group.classList.add('step2');
  idInput.readOnly = true;
  pwInput.tabIndex = 0;
  document.getElementById('pwArrow').tabIndex = 0;
  setTimeout(()=>pwInput.focus(), 120);
}

function backToIdStep(){
  group.classList.remove('step2');
  idInput.readOnly = false;
  pwInput.value = '';
  pwInput.tabIndex = -1;
  document.getElementById('pwArrow').tabIndex = -1;
  hideMsg('login-msg');
  idInput.focus();
  idInput.select();
}

idInput.addEventListener('input', ()=>{
  document.getElementById('idArrow').classList.toggle('ready', idInput.value.trim().length > 0);
});
idInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); if(!group.classList.contains('step2')) goPasswordStep(); }
});
pwInput.addEventListener('input', ()=>{
  document.getElementById('pwArrow').classList.toggle('ready', pwInput.value.length > 0);
});
pwInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); doLogin(); }
});
// 아이폰 암호 자동완성이 두 칸을 한 번에 채운 경우 바로 2단계로
pwInput.addEventListener('change', ()=>{
  if(pwInput.value && idInput.value && !group.classList.contains('step2')) goPasswordStep();
});

/* ── 소셜 로그인 복귀 처리 (#token / #link_ticket / #social_error) ── */
let linkTicket = null;

function finishLogin(data){
  localStorage.setItem('token', data.access_token || data.token);
  localStorage.setItem('full_name', data.full_name);
  localStorage.setItem('role', data.role);
  location.href = '/index.html';
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelector('.tabs').style.display = (name === 'link') ? 'none' : '';
}

const socialReturn = (function(){
  if(!location.hash || location.hash.length < 2) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);   // 토큰이 주소창·방문기록에 남지 않게
  if(p.get('token')){
    finishLogin({token:p.get('token'), full_name:p.get('full_name'), role:p.get('role')});
    return 'done';
  }
  if(p.get('social_error')){
    showMsg('login-msg', p.get('social_error'), 'error');
    return 'error';
  }
  if(p.get('link_ticket')){
    linkTicket = p.get('link_ticket');
    const nick = p.get('nickname') || '카카오 사용자';
    document.getElementById('linkTitle').textContent = `${nick}님, 처음 오셨네요`;
    showScreen('link');
    setTimeout(()=>document.getElementById('link-username').focus(), 50);
    return 'link';
  }
  return null;
})();

function showSocialRegister(on){
  document.getElementById('linkExisting').style.display = on ? 'none' : '';
  document.getElementById('linkRegister').style.display = on ? '' : 'none';
  document.getElementById('linkDesc').textContent = on
    ? '가입 신청 후 관리자가 승인하면 카카오로 바로 로그인할 수 있어요.'
    : '기존 contigoway 계정에 연결하면 다음부터 카카오로 바로 로그인돼요.';
}

function cancelSocialLink(){
  linkTicket = null;
  showSocialRegister(false);
  showScreen('login');
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-register').classList.remove('active');
}

async function postJSON(path, payload){
  const r = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  let data = {};
  try{ data = await r.json(); }catch(e){}
  return {ok:r.ok, data};
}

async function doSocialLink(){
  const username = document.getElementById('link-username').value.trim();
  const password = document.getElementById('link-password').value;
  if(!username || !password){ showMsg('link-msg','아이디(또는 전화번호)와 비밀번호를 입력해주세요','error'); return; }
  const btn = document.getElementById('linkBtn'); btn.disabled = true;
  try{
    const {ok, data} = await postJSON('/auth/social/link', {ticket:linkTicket, username, password});
    if(!ok){ showMsg('link-msg', data.detail || '연결하지 못했어요', 'error'); return; }
    if(data.access_token){ finishLogin(data); return; }
    showMsg('link-msg', data.message, 'success');
  }catch(e){ showMsg('link-msg','서버에 연결하지 못했어요','error'); }
  finally{ btn.disabled = false; }
}

async function doSocialRegister(){
  const payload = {
    ticket: linkTicket,
    username: document.getElementById('sreg-username').value.trim(),
    full_name: document.getElementById('sreg-fullname').value.trim(),
    email: document.getElementById('sreg-email').value.trim(),
  };
  const phone = document.getElementById('sreg-phone').value.trim();
  if(phone) payload.phone = phone;
  if(!payload.username || !payload.full_name || !payload.email){ showMsg('sreg-msg','아이디, 이름, 이메일을 입력해주세요','error'); return; }
  try{
    const {ok, data} = await postJSON('/auth/social/register', payload);
    if(!ok){
      const d = Array.isArray(data.detail) ? '입력 형식을 확인해주세요' : data.detail;
      showMsg('sreg-msg', d || '가입 신청에 실패했어요', 'error'); return;
    }
    showMsg('sreg-msg', data.message, 'success');
  }catch(e){ showMsg('sreg-msg','서버에 연결하지 못했어요','error'); }
}

/* ── 계정 저장 ── */
(function restoreSavedId(){
  const saved = localStorage.getItem(SAVED_ID_KEY);
  if(!saved || socialReturn === 'link' || socialReturn === 'done') return;
  idInput.value = saved;
  document.getElementById('rememberId').checked = true;
  goPasswordStep();
})();

document.getElementById('rememberId').addEventListener('change', e=>{
  if(!e.target.checked) localStorage.removeItem(SAVED_ID_KEY);
});

async function doLogin(){
  const username = idInput.value.trim();
  const password = pwInput.value;
  if(!group.classList.contains('step2')){ goPasswordStep(); return; }
  if(!password){ showMsg('login-msg','비밀번호를 입력해주세요','error'); pwInput.focus(); return; }

  const btn = document.getElementById('pwArrow');
  btn.disabled = true;
  try{
    const body = new URLSearchParams();
    body.append('username', username);
    body.append('password', password);
    const r = await fetch(API + '/auth/login', { method:'POST', body });
    const data = await r.json();
    if(!r.ok){
      showMsg('login-msg', data.detail || '아이디 또는 비밀번호가 맞지 않아요', 'error');
      pwInput.value = ''; pwInput.focus();
      return;
    }
    if(document.getElementById('rememberId').checked) localStorage.setItem(SAVED_ID_KEY, username);
    else localStorage.removeItem(SAVED_ID_KEY);

    localStorage.setItem('token', data.access_token);
    localStorage.setItem('full_name', data.full_name);
    localStorage.setItem('role', data.role);
    location.href = '/index.html';
  }catch(e){
    showMsg('login-msg','서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요','error');
  }finally{
    btn.disabled = false;
  }
}

/* ── 계정/암호 찾기 (다음 단계에서 연결) ── */
function openFind(kind){
  const label = kind === 'pw' ? '암호 재설정' : '아이디 찾기';
  showMsg('login-msg', `${label} 기능은 곧 연결돼요. 급하면 관리자에게 문의해주세요.`, 'info');
}

/* ── 소셜 로그인 ── */
function socialLogin(provider){
  if(SOCIAL[provider]){ location.href = SOCIAL[provider]; return; }
  showMsg('login-msg', `${SOCIAL_NAME[provider]} 로그인은 곧 연결돼요.`, 'info');
}

/* ── 회원가입 (기존) ── */
async function doRegister(){
  const username = document.getElementById('reg-username').value.trim();
  const full_name = document.getElementById('reg-fullname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  if(!username || !full_name || !email || !password){ showMsg('reg-msg','필수 항목을 모두 입력해주세요','error'); return; }
  try{
    const payload = {username, full_name, email, password};
    if(phone) payload.phone = phone;
    const r = await fetch(API + '/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if(!r.ok){ showMsg('reg-msg', data.detail || '가입 신청 실패', 'error'); return; }
    showMsg('reg-msg', '가입 신청 완료! 관리자 승인 후 로그인할 수 있어요.', 'success');
  }catch(e){ showMsg('reg-msg','오류가 발생했습니다','error'); }
}
